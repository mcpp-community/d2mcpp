# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy Online EBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "book/src/**"
      - "book/en/src/**"

  pull_request:
    paths:
      - "book/**"
      - "README*.md"
      - "docs/**"
      - "scripts/**"
      - ".xlings.json"
      - ".github/workflows/online-ebook.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: book

    steps:
      - uses: actions/checkout@v4

      - name: Validate course and documentation links
        run: python3 ../scripts/ci/check-project.py

      - name: Install the shared xlings baseline
        run: bash ../scripts/install-xlings.sh

      - name: Install the course dependencies from .xlings.json
        run: xlings install -y

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with mdBook
        run: |
          ./build.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/book

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
